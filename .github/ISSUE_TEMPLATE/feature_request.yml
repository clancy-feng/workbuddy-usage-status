name: ✨ 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你的痛点
      description: 这个功能能解决什么痛点？
      placeholder: 比如"我同时用 WorkBuddy 做多个项目，需要知道每个项目的 credit 消耗"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望这个功能怎么实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有其他工具的实现可以参考？
    validations:
      required: false